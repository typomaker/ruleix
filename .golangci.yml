version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - lll
    - misspell
    - nestif
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - wastedassign

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
